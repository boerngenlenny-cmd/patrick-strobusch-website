<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1b2026"/>
      <stop offset="60%" stop-color="#0f1216"/>
      <stop offset="100%" stop-color="#080a0c"/>
    </radialGradient>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c333c"/>
      <stop offset="100%" stop-color="#12161b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffbf6b"/>
      <stop offset="100%" stop-color="#e0243f"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 150H600M0 300H600M0 450H600M150 0V600M300 0V600M450 0V600"/>
  </g>
  <!-- rim halo behind silhouette -->
  <ellipse cx="300" cy="250" rx="150" ry="160" fill="url(#rim)" opacity="0.14" filter="url(#soft)"/>
  <!-- silhouette: head + shoulders -->
  <g filter="url(#soft)">
    <path d="M300 560c-140 0-215-70-215-165 0-70 60-120 140-130-40-22-64-64-64-114 0-77 62-131 139-131s139 54 139 131c0 50-24 92-64 114 80 10 140 60 140 130 0 95-75 165-215 165z" fill="url(#sil)" stroke="url(#rim)" stroke-width="2" stroke-opacity="0.55"/>
  </g>
  <!-- monogram watermark -->
  <text x="300" y="300" font-family="Georgia, serif" font-size="150" font-weight="700" fill="#ffbf6b" fill-opacity="0.10" text-anchor="middle" dominant-baseline="middle">?</text>
  <!-- label -->
  <text x="300" y="530" font-family="'Courier New', monospace" font-size="20" letter-spacing="6" fill="#efe6d6" fill-opacity="0.62" text-anchor="middle">SUBJEKT: P.S.</text>
</svg>
